# Quant Platform — configurazione unificata (finance-alert + stock_analysis + Finance-Analyzer)

unified:
  enabled: true
  enrich_telegram: true
  quality_gate_block: false
  min_fundamental_score: 40
  min_unified_score: 5.0
  include_regulatory: true
  screener_min_score: 7.0

  # ── Monitoraggio globale ──
  # true = ogni scan include screener_tickers sotto (oltre a watchlist.yaml)
  include_global_screener: true
  # true = include ticker promossi da: python -m finance_alert --screen --update-watchlist
  use_dynamic_watchlist: true
  dynamic_min_score: 6.0
  # Limite titoli per scan (scan più lenti → più headroom; Finnhub free ~60 req/min)
  max_scan_symbols: 100

  # Universo multi-mercato (suffissi Yahoo). Aggiungi/rimuovi liberamente.
  screener_tickers:
    # USA (oltre a watchlist.yaml)
    - MSTR
    - RIOT
    - SOXL
    - BITO
    # Europa
    - SAP.DE
    - MC.PA
    - ASML.AS
    - RACE.MI
    - NESN.SW
    - SHEL.L
    - SAN.MC
    - OR.PA
    # UK
    - VOD.L
    - HSBA.L
    # Asia-Pacifico
    - 7203.T
    - 9984.T
    - BABA
    - TSM
    - 0700.HK
    - RELIANCE.NS
    # Americas ex-US
    - VALE
    - PBR

regulatory:
  fca:
    enabled: true
  fsa_edinet:
    enabled: true
    lookback_days: 14
  amf:
    enabled: true
  esma:
    enabled: true
  bafin:
    enabled: true
  consob:
    enabled: true
