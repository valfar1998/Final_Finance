# Quant Platform — configurazione unificata (finance-alert + stock_analysis + Finance-Analyzer)

unified:
  enabled: true
  enrich_telegram: true
  quality_gate_block: false
  min_fundamental_score: 40
  min_unified_score: 5.0
  include_regulatory: true
  screener_min_score: 7.0

  # Watchlist già a 100 titoli growth/quality → niente screener/dynamic extra
  include_global_screener: false
  use_dynamic_watchlist: false
  dynamic_min_score: 6.0
  max_scan_symbols: 100

  # Riserva (solo se riattivi include_global_screener)
  screener_tickers:
    - ASML.AS
    - SAP.DE
    - 7203.T
    - 0700.HK
    - 005930.KS
    - TSM
    - BABA
    - PDD

regulatory:
  fca:
    enabled: true
  fsa_edinet:
    enabled: true
    lookback_days: 14
  opendart:
    enabled: true
    lookback_days: 14
  amf:
    enabled: true
  esma:
    enabled: true
  bafin:
    enabled: true
  consob:
    enabled: true
