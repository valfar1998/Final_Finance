# Modalità SWING: target ~2–3% in ~7 giorni.
# Invia solo setup ≥ min_setup_score (default 6/10).

watchlist:
  - ticker: NVDA
    name: NVIDIA
    cik: "0001045810"
  - ticker: AAPL
    name: Apple
    cik: "0000320193"
  - ticker: MSFT
    name: Microsoft
    cik: "0000789019"
  - ticker: GOOGL
    name: Alphabet
    cik: "0001652044"
  - ticker: AMZN
    name: Amazon
    cik: "0001018724"
  - ticker: META
    name: Meta
    cik: "0001326801"
  - ticker: TSLA
    name: Tesla
    cik: "0001318605"
  - ticker: AMD
    name: AMD
    cik: "0000002488"
  - ticker: AVGO
    name: Broadcom
    cik: "0001730168"
  - ticker: SMCI
    name: Super Micro
    cik: "0001375365"

rules:
  only_upside: true
  enabled_tipos:
    - earnings_surprise
    - filing_8k
    - extended_hours
    - peer_lag
    - news

  swing:
    target_pct: 2.5
    stop_pct: 1.5
    horizon_days: 7
    min_setup_score: 6
    chase_pct: 4.0
    pullback_from_close_pct: 0.5

  extended_hours_pct: 1.5
  peer_lag_leader_pct: 2.5
  peer_lag_max_pct: 1.0

  surprise_eps_pct: 3.0
  surprise_revenue_pct: 2.5
  earnings_lookahead_hours: 48

  news_max_age_hours: 2
  news_min_score: 7
  news_require_wire: true
  news_keywords:
    - [guidance raised, 8]
    - [raises guidance, 8]
    - [raised guidance, 8]
    - [guidance, 5]
    - [beat estimates, 7]
    - [beats estimates, 7]
    - [fda approval, 8]
    - [fda approves, 8]
    - [merger, 8]
    - [acquisition, 8]
    - [to acquire, 7]
    - [buyout, 8]
    - [takeover, 8]
    - [upgrade, 5]
    - [downgrade, 5]
    - [record revenue, 6]
    - [partnership, 5]
    - [contract, 5]
  news_block_publishers:
    - chartmill
    - zacks
    - investorplace
  news_block_headline:
    - "why "
    - "could "
    - "might "
    - "should you"
    - "top pick"
    - "stock to buy"
    - "analysis:"
    - "opinion"
    - "what to know"
    - "here's why"
  news_boost_publishers:
    - reuters
    - bloomberg
    - cnbc
    - pr newswire
    - business wire
    - globenewswire
    - associated press
    - benzinga
    - wall street journal
  news_opinion_publishers:
    - seekingalpha
    - seeking alpha
    - motley fool
  news_opinion_need:
    - upgrade
    - guidance
    - beat
    - fda
    - merger
    - acquisition

  spike_pct: 8.0
  spike_buckets: [8, 10, 15]
  momentum_pct: 99.0
  momentum_minutes: 30
  filing_items_only: ["2.02", "1.01", "8.01", "7.01"]

clusters:
  - name: semis
    tickers: [NVDA, AVGO, AMD, SMCI]
  - name: megacap
    tickers: [AAPL, MSFT, GOOGL, AMZN, META]

edgar:
  enabled: true
  forms: ["8-K", "8-K/A"]
  max_age_hours: 18
