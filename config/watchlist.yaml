rules:
  only_upside: true
  peer_resistance: true
  earnings_gate_enabled: true
  enabled_tipos:
    - earnings_surprise
    - filing_8k
    - extended_hours
    - peer_lag
    - news

  swing:
    target_pct: 2.5
    stop_pct: 1.5
    horizon_days: 7
    min_setup_score: 6
    chase_pct: 4.0
    pullback_from_close_pct: 0.5
    use_atr: true
    atr_period: 14
    atr_target_mult: 1.5
    atr_stop_mult: 1.0

  llm:
    enabled: true
    prefilter_score: 6
    min_llm_score: 6
    timeout_sec: 3
    fallback_keyword_score: 8

  volume:
    min_rvol: 3.0
    require_for_extended: true
    require_for_spike: true
    peer_leader_min_rvol: 2.5
    min_dollar_volume: 250000
    min_dollar_volume_high_beta: 500000
    require_dollar_volume_extended: true
    require_dollar_volume_peer: true

  macro:
    enabled: true
    etfs: [SPY, QQQ]
    stress_pct: -1.5
    stressed_min_setup_score: 8

  dedupe:
    similarity_threshold: 0.65
    keep_days: 21
    time_window_hours: 2
    llm_equivalence: true

  extended_hours_pct: 1.5
  peer_lag_leader_pct: 2.5
  peer_lag_max_pct: 1.0

  surprise_eps_pct: 3.0
  surprise_revenue_pct: 2.5
  earnings_lookahead_hours: 48

  news_max_age_hours: 2
  news_min_score: 7
  news_require_wire: true
  news_keywords:
    - [guidance raised, 8]
    - [raises guidance, 8]
    - [raised guidance, 8]
    - [guidance, 5]
    - [beat estimates, 7]
    - [beats estimates, 7]
    - [fda approval, 8]
    - [fda approves, 8]
    - [merger, 8]
    - [acquisition, 8]
    - [to acquire, 7]
    - [buyout, 8]
    - [takeover, 8]
    - [upgrade, 5]
    - [downgrade, 5]
    - [record revenue, 6]
    - [partnership, 5]
    - [contract, 5]
  news_block_publishers:
    - chartmill
    - zacks
    - investorplace
  news_block_headline:
    - "why "
    - "could "
    - "might "
    - "should you"
    - "top pick"
    - "stock to buy"
    - "analysis:"
    - "opinion"
    - "what to know"
    - "here's why"
  news_boost_publishers:
    - reuters
    - bloomberg
    - cnbc
    - pr newswire
    - business wire
    - globenewswire
    - associated press
    - benzinga
    - wall street journal
  news_opinion_publishers:
    - seekingalpha
    - seeking alpha
    - motley fool
  news_opinion_need:
    - upgrade
    - guidance
    - beat
    - fda
    - merger
    - acquisition

  spike_pct: 8.0
  spike_buckets: [8, 10, 15]
  momentum_pct: 99.0
  momentum_minutes: 30
  filing_items_only: ["2.02", "1.01", "5.02", "8.01"]

