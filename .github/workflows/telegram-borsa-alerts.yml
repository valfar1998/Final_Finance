name: Telegram borsa alerts

on:
  schedule:
    # Lun–ven: premarket USA → after-hours
    - cron: "*/15 8-23 * * 1-5"
    # Sab–dom: news / filing / utili domenica sera (meno frequente)
    - cron: "0 */2 8-22 * * 0,6"
    # Digest pre-apertura USA (~07:30 ET)
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Invia solo un ping di prova sul bot"
        type: boolean
        default: false
      dry_run:
        description: "Calcola gli avvisi senza inviarli"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Dipendenze
        run: pip install -r requirements-cloud.txt

      - uses: actions/cache/restore@v4
        if: ${{ github.event.inputs.test != 'true' }}
        with:
          path: data/telegram_alerts_sent.json
          key: telegram-borsa-sent-${{ github.run_id }}
          restore-keys: |
            telegram-borsa-sent-

      - name: Borsa → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          PYTHONUTF8: "1"
          PYTHONPATH: "."
          GITHUB_ACTIONS: "true"
        run: |
          # Non stampa i secret: solo se sono vuoti (caso tipico: Update secret senza Value)
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID vuoti. In Settings → Secrets reinsetta entrambi (non lasciare Value vuoto su Update)."
            exit 1
          fi
          echo "telegram secrets: token_len=${#TELEGRAM_BOT_TOKEN} chat_len=${#TELEGRAM_CHAT_ID}"
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python scripts/notify_borsa.py --test
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/notify_borsa.py --dry-run
          else
            python scripts/notify_borsa.py
          fi

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/telegram_alerts_sent.json') != ''
        with:
          path: data/telegram_alerts_sent.json
          key: telegram-borsa-sent-${{ github.run_id }}
