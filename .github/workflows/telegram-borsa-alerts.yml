name: Telegram borsa alerts

on:
  schedule:
    # Swing ~7g: ritardo 10–20 min irrilevante → meno scan, più titoli monitorati
    # Lun–ven: premarket USA → after-hours, ogni 20 min
    - cron: "0,20,40 8-23 * * 1-5"
    # Open USA (~14–16 CET): ogni 10 min (leggermente più frequente)
    - cron: "0,10,20,30,40,50 12-13 * * 1-5"
    # Sab–dom: ogni 3 ore (news / filing)
    - cron: "0 8,11,14,17,20 * * 0,6"
    # Digest pre-apertura USA (~07:30 ET)
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Invia solo un ping di prova sul bot"
        type: boolean
        default: false
      dry_run:
        description: "Calcola gli avvisi senza inviarli"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Dipendenze
        run: pip install -r requirements-cloud.txt

      - uses: actions/cache/restore@v4
        if: ${{ github.event.inputs.test != 'true' }}
        with:
          path: |
            data/telegram_alerts_sent.json
            data/rvol_baseline.json
            data/performance_tracker.json
          key: telegram-borsa-state-${{ github.run_id }}
          restore-keys: |
            telegram-borsa-state-

      - name: Borsa → Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          BENZINGA_API_TOKEN: ${{ secrets.BENZINGA_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_LLM_PROVIDER: ${{ secrets.NEWS_LLM_PROVIDER }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FCA_AUTH_EMAIL: ${{ secrets.FCA_AUTH_EMAIL }}
          FCA_API_KEY: ${{ secrets.FCA_API_KEY }}
          FSA_EDINET_API_KEY: ${{ secrets.FSA_EDINET_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PYTHONUTF8: "1"
          PYTHONPATH: "."
          GITHUB_ACTIONS: "true"
        run: |
          # Non stampa i secret: solo se sono vuoti (caso tipico: Update secret senza Value)
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID vuoti. In Settings → Secrets reinsetta entrambi (non lasciare Value vuoto su Update)."
            exit 1
          fi
          echo "telegram secrets: token_len=${#TELEGRAM_BOT_TOKEN} chat_len=${#TELEGRAM_CHAT_ID}"
          if [ -n "${UPSTASH_REDIS_REST_URL}" ] && [ -n "${UPSTASH_REDIS_REST_TOKEN}" ]; then
            echo "upstash_redis: configured (dedupe condivisa tra run)"
          else
            echo "upstash_redis: not configured — fallback cache file locale"
          fi
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python scripts/notify_borsa.py --test
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/notify_borsa.py --dry-run
          else
            python scripts/notify_borsa.py
          fi

      - uses: actions/cache/save@v4
        if: always() && (hashFiles('data/telegram_alerts_sent.json') != '' || hashFiles('data/rvol_baseline.json') != '' || hashFiles('data/performance_tracker.json') != '')
        with:
          path: |
            data/telegram_alerts_sent.json
            data/rvol_baseline.json
          key: telegram-borsa-state-${{ github.run_id }}
