# Tiene vivi gli schedule GitHub (si spengono dopo ~60 giorni senza push).
name: Keep-alive schedule borsa

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Touch keepalive + push
        run: |
          set -e
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/.actions_keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/.actions_keepalive
          if git diff --cached --quiet; then
            echo "keepalive invariato"
            exit 0
          fi
          git commit -m "chore: keep-alive schedule borsa $(date -u +%Y-%m-%d)"
          git push
